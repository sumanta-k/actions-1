name: GENERATE ASCII OF DRAGON
on: push
jobs:
  build_job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Install cowsay program
        run: sudo apt install cowsay -y

      - name: Execute Cowsay CMD
        run: cowsay -f dragon "Run for cover, I am a dragon .... RAWR" >> dragon.txt

      - name: Sleep for 30s
        run: sleep 30
