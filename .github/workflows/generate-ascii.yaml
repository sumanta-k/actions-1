name: GENERATE ASCII OF DRAGON
on: push
jobs:
  build_job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Install cowsay program
        run: sudo apt install cowsay -y

      - name: Execute Cowsay CMD
        run: cowsay -f dragon "Run for cover, I am a dragon .... RAWR" >> dragon.txt

      - name: Sleep for 30s
        run: sleep 30
  test_job_2:
    needs: build_job_1
    runs-on: ubuntu-latest
    steps:
      - name: Sleep for 10s
        run: sleep 10

      - name: Test File Exists or Not
        run: grep -i "dragon" dragon.txt

  deploy_job_3:
    needs: test_job_2
    runs-on: ubuntu-latest
    steps:
      - name: Read File
        run: cat dragon.txt

      - name: Deploy
        run: echo "deploying..."
