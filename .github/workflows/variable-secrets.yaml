name: Exploring Variables and Secrets

on: push
env:
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: sumanta601
  DOCKER_IMAGE_NAME: github-actions-nginx
  DOCKER_PASSWORD: bleachIchigo

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Docker Build
        run: echo docker build -t ${{env.DOCKER_REGISTRY}}/${{env.DOCKER_USERNAME}}/${{env.DOCKER_IMAGE_NAME}}:latest

      - name: Docker Login
        run: echo docker login --username=$DOCKER_USERNAME--password=$DOCKER_PASSWORD

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Docker Run
        run: echo docker run -d -p 8080:80 $DOCKER_REGISTRY/$DOCKER_USERNAME/$DOCKER_IMAGE_NAME:latest
