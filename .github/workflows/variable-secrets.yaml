name: Exploring Variables and Secrets

on: push

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Docker Build
        run: docker build -t docker.io/sumanta601/imageName:latest
      - name: Docker Login
        run: docker login --username=sumanta601 --password=bleachIchigo

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Docker Run
        run: docker run -d -p 8080:80 docker.io/sumanta601/imageName:latest
