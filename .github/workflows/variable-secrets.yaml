name: Exploring Variables and Secrets

on: push
env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE_NAME: github-actions-nginx

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Docker Build
        run: echo docker build -t ${{env.DOCKER_REGISTRY}}/${{vars.DOCKER_USERNAME}}/${{env.DOCKER_IMAGE_NAME}}:latest

      - name: Docker Login
        run: echo docker login --username=${{vars.DOCKER_USERNAME}} --password=${{secrets.DOCKER_PASSWORD}}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Docker Run
        run: echo docker run -d -p 8080:80 $DOCKER_REGISTRY/${{vars.DOCKER_USERNAME}}/$DOCKER_IMAGE_NAME:latest
